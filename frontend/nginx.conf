server {
  listen 80;
  server_name _;

  # Photos téléphone souvent > 1 Mo (défaut nginx) → sinon 413 HTML
  client_max_body_size 25m;

  root /usr/share/nginx/html;
  index index.html;

  # Empêche le cache agressif des en-têtes hérités
  etag off;
  if_modified_since off;

  # SSE chat — pas de buffering, timeouts longs
  location = /api/chat/events {
    proxy_pass http://backend:4000/api/chat/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    client_max_body_size 25m;
  }

  # ^~ : prioritaire sur la regex images ci-dessous (sinon /uploads/*.jpg → 404 SPA)
  location ^~ /uploads/ {
    proxy_pass http://backend:4000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    client_max_body_size 25m;
  }

  # JS/CSS hashés Vite → cache long (le nom de fichier change à chaque build)
  # ^~ : prioritaire sur les regex images ci-dessous
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Favicons / logos : jamais de fallback SPA (sinon Chrome reçoit du HTML → icône globe)
  location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # Version build — jamais en cache (détection nouvelle version)
  location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Surrogate-Control "no-store" always;
    try_files $uri =404;
  }

  # index.html — jamais en cache (pointe vers les nouveaux assets)
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Surrogate-Control "no-store" always;
  }

  location = /manifest.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
  }

  location / {
    # SPA : chaque navigation doit pouvoir récupérer le dernier index.html
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Surrogate-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
